spring:
  application:
    name: transaction-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/transactiondb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082

bank:
  security:
    secret: ${BANK_SECURITY_SECRET}
    expiration: ${BANK_SECURITY_EXPIRATION:86400000}

account-service:
  url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}